security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_users:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_users
            custom_authenticator: App\Security\AdminFormAuthenticator
            entry_point: App\Security\AdminFormAuthenticator
            access_denied_handler: App\Security\HideAdminAccessDeniedHandler
            logout:
                path: admin_logout
                target: home
                enable_csrf: true

    access_control:
        - { path: ^/admin-panel$, roles: PUBLIC_ACCESS }
        - { path: ^/admin-panel, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
